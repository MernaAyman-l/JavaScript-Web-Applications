<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A product shop demo with API fetching, category filters and price sorting.">
  <title>Product Shop | Filter & Sort</title>
  <style>
    * { box-sizing:border-box; }
    body { margin:0; padding:28px 18px; font-family:Arial,sans-serif; background:#f4f5fa; color:#292936; }
    main { max-width:1200px; margin:auto; }
    h1 { text-align:center; color:#4c2c91; margin:0 0 24px; }
    .toolbar { display:grid; gap:16px; margin-bottom:22px; }
    .filters,.sort-buttons { display:flex; justify-content:center; flex-wrap:wrap; gap:10px; }
    .filters label { background:#fff; padding:10px 14px; border-radius:8px; box-shadow:0 2px 8px #2221; cursor:pointer; }
    button { border:0; padding:11px 16px; border-radius:8px; background:#6236b4; color:#fff; cursor:pointer; font-size:14px; }
    button:hover { background:#44217f; }
    button[aria-pressed="true"] { background:#2d1b50; outline:2px solid #a98be0; }
    #status { min-height:24px; text-align:center; color:#66577b; }
    #products { display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:18px; }
    .product { display:flex; flex-direction:column; align-items:center; background:#fff; padding:16px; border-radius:12px; box-shadow:0 4px 15px #2221; text-align:center; }
    .product img { width:100%; height:170px; object-fit:contain; }
    .product h2 { font-size:16px; line-height:1.4; margin:14px 0 8px; }
    .category { color:#71677f; font-size:13px; }
    .price { margin-top:auto; padding-top:12px; font-weight:700; color:#4c2c91; }
    @media(max-width:520px) { body { padding:20px 12px; } }
  </style>
</head>
<body>
  <main>
    <h1>Product Shop</h1>
    <section class="toolbar" aria-label="Product controls">
      <div class="filters">
        <label><input type="checkbox" value="men's clothing"> Men's Clothing</label>
        <label><input type="checkbox" value="women's clothing"> Women's Clothing</label>
        <label><input type="checkbox" value="jewelery"> Jewelry</label>
        <label><input type="checkbox" value="electronics"> Electronics</label>
      </div>
      <div class="sort-buttons" aria-label="Sort products by price">
        <button type="button" data-sort="asc" aria-pressed="false">Price: Low to High</button>
        <button type="button" data-sort="desc" aria-pressed="false">Price: High to Low</button>
        <button type="button" data-sort="default" aria-pressed="true">Default Order</button>
      </div>
    </section>
    <p id="status" role="status" aria-live="polite">Loading products...</p>
    <section id="products" aria-label="Products"></section>
  </main>

  <script>
    let products = [];
    let sortOrder = 'default';
    const container = document.getElementById('products');
    const status = document.getElementById('status');
    const categoryInputs = [...document.querySelectorAll('.filters input')];
    const sortButtons = [...document.querySelectorAll('[data-sort]')];

    function getVisibleProducts() {
      const selected = categoryInputs.filter(input => input.checked).map(input => input.value);
      let visible = selected.length
        ? products.filter(product => selected.includes(product.category))
        : [...products];

      if (sortOrder === 'asc') visible.sort((a, b) => a.price - b.price);
      if (sortOrder === 'desc') visible.sort((a, b) => b.price - a.price);
      return visible;
    }

    function renderProducts() {
      const visible = getVisibleProducts();
      container.replaceChildren();

      if (visible.length === 0) {
        status.textContent = products.length ? 'No products match the selected categories.' : '';
        return;
      }
      status.textContent = visible.length + ' product(s)';

      visible.forEach(product => {
        const card = document.createElement('article');
        const image = document.createElement('img');
        const title = document.createElement('h2');
        const category = document.createElement('p');
        const price = document.createElement('p');

        card.className = 'product';
        image.src = product.image;
        image.alt = product.name;
        image.loading = 'lazy';
        image.onerror = () => { image.onerror = null; image.alt = 'Product image unavailable'; image.removeAttribute('src'); };
        title.textContent = product.name;
        category.className = 'category';
        category.textContent = product.category;
        price.className = 'price';
        price.textContent = '$' + product.price.toFixed(2);

        card.append(image, title, category, price);
        container.appendChild(card);
      });
    }

    async function fetchProducts() {
      status.textContent = 'Loading products...';
      try {
        const response = await fetch('https://fakestoreapi.com/products');
        if (!response.ok) throw new Error('The product service returned an error.');
        const data = await response.json();
        if (!Array.isArray(data)) throw new Error('Unexpected product data.');

        products = data.map(item => ({
          name: String(item.title ?? 'Untitled product'),
          category: String(item.category ?? 'Uncategorized'),
          price: Number(item.price),
          image: String(item.image ?? '')
        })).filter(item => Number.isFinite(item.price) && item.price >= 0);

        renderProducts();
      } catch (error) {
        container.replaceChildren();
        status.textContent = 'Could not load products. Check your internet connection and try again.';
        console.error('Product loading failed:', error);
      }
    }

    categoryInputs.forEach(input => input.addEventListener('change', renderProducts));
    sortButtons.forEach(button => {
      button.addEventListener('click', () => {
        sortOrder = button.dataset.sort;
        sortButtons.forEach(item => item.setAttribute('aria-pressed', String(item === button)));
        renderProducts();
      });
    });

    fetchProducts();
  </script>
</body>
</html>
