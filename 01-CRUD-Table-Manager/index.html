<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A simple CRUD table manager built with HTML, CSS and vanilla JavaScript.">
  <title>مدير البيانات | CRUD Table Manager</title>
  <style>
    :root { color-scheme: light; --accent:#d63384; --accent-dark:#ad1457; --surface:#fff; --bg:#fff5f9; --text:#30232a; }
    * { box-sizing:border-box; }
    body { margin:0; padding:32px 16px; font-family:Tahoma,Arial,sans-serif; background:var(--bg); color:var(--text); }
    main { width:min(900px,100%); margin:auto; }
    h1 { text-align:center; color:var(--accent-dark); margin:0 0 8px; }
    .intro { text-align:center; color:#705b66; margin:0 0 24px; }
    form,.table-wrap { background:var(--surface); padding:20px; border-radius:14px; box-shadow:0 8px 28px #8a31501a; margin-bottom:20px; }
    .fields { display:grid; grid-template-columns:1fr 1fr auto; gap:12px; align-items:end; }
    label { display:block; font-weight:600; margin-bottom:6px; }
    input { width:100%; padding:12px; border:1px solid #e8b8cf; border-radius:8px; font:inherit; }
    input:focus { outline:2px solid #f3a6c8; border-color:var(--accent); }
    button { border:0; border-radius:8px; padding:11px 16px; font:inherit; cursor:pointer; background:var(--accent); color:white; }
    button:hover { background:var(--accent-dark); }
    button:focus-visible { outline:3px solid #f3a6c8; outline-offset:2px; }
    .secondary { background:#f8d7e7; color:#54263d; }
    .danger { background:#b42345; }
    .actions { display:flex; gap:8px; }
    table { width:100%; border-collapse:collapse; }
    th,td { padding:12px; border-bottom:1px solid #f1dce6; text-align:right; }
    th { background:#fce4ef; color:#70264a; }
    .empty { text-align:center; color:#806b76; padding:22px; }
    .status { min-height:24px; color:#8a2455; margin:0 0 12px; }
    @media(max-width:620px) {
      .fields { grid-template-columns:1fr; }
      .table-wrap { overflow-x:auto; }
      table { min-width:480px; }
    }
  </style>
</head>
<body>
  <main>
    <h1>مدير البيانات</h1>
    <p class="intro">تطبيق بسيط لتجربة عمليات الإضافة والعرض والتعديل والحذف (CRUD).</p>

    <form id="dataForm" novalidate>
      <div class="fields">
        <div>
          <label for="name">الاسم</label>
          <input type="text" id="name" maxlength="60" placeholder="اكتب الاسم" required>
        </div>
        <div>
          <label for="age">العمر</label>
          <input type="number" id="age" min="1" max="120" step="1" placeholder="اكتب العمر" required>
        </div>
        <button type="submit" id="submitButton">إضافة</button>
      </div>
    </form>

    <p class="status" id="status" role="status" aria-live="polite"></p>
    <section class="table-wrap" aria-label="جدول البيانات">
      <table>
        <thead><tr><th>الاسم</th><th>العمر</th><th>الإجراءات</th></tr></thead>
        <tbody id="tableBody"></tbody>
      </table>
    </section>
  </main>

  <script>
    const records = [];
    let editingIndex = null;
    const form = document.getElementById('dataForm');
    const nameInput = document.getElementById('name');
    const ageInput = document.getElementById('age');
    const submitButton = document.getElementById('submitButton');
    const tableBody = document.getElementById('tableBody');
    const status = document.getElementById('status');

    function renderTable() {
      tableBody.replaceChildren();
      if (records.length === 0) {
        const row = document.createElement('tr');
        const cell = document.createElement('td');
        cell.colSpan = 3;
        cell.className = 'empty';
        cell.textContent = 'لا توجد بيانات حتى الآن.';
        row.appendChild(cell);
        tableBody.appendChild(row);
        return;
      }

      records.forEach((record, index) => {
        const row = document.createElement('tr');
        const nameCell = document.createElement('td');
        const ageCell = document.createElement('td');
        const actionsCell = document.createElement('td');
        const actions = document.createElement('div');
        const editButton = document.createElement('button');
        const deleteButton = document.createElement('button');

        nameCell.textContent = record.name;
        ageCell.textContent = String(record.age);
        actions.className = 'actions';
        editButton.type = deleteButton.type = 'button';
        editButton.className = 'secondary';
        deleteButton.className = 'danger';
        editButton.textContent = 'تعديل';
        deleteButton.textContent = 'حذف';
        editButton.addEventListener('click', () => editRecord(index));
        deleteButton.addEventListener('click', () => deleteRecord(index));

        actions.append(editButton, deleteButton);
        actionsCell.appendChild(actions);
        row.append(nameCell, ageCell, actionsCell);
        tableBody.appendChild(row);
      });
    }

    form.addEventListener('submit', (event) => {
      event.preventDefault();
      const name = nameInput.value.trim();
      const age = Number(ageInput.value);

      if (!name || !Number.isInteger(age) || age < 1 || age > 120) {
        status.textContent = 'من فضلك أدخل اسمًا صحيحًا وعمرًا من 1 إلى 120.';
        return;
      }

      if (editingIndex === null) {
        records.push({ name, age });
        status.textContent = 'تمت إضافة السجل بنجاح.';
      } else {
        records[editingIndex] = { name, age };
        status.textContent = 'تم تحديث السجل بنجاح.';
        editingIndex = null;
        submitButton.textContent = 'إضافة';
      }
      form.reset();
      renderTable();
    });

    function editRecord(index) {
      const record = records[index];
      if (!record) return;
      nameInput.value = record.name;
      ageInput.value = record.age;
      editingIndex = index;
      submitButton.textContent = 'حفظ التعديل';
      status.textContent = 'عدّل البيانات ثم اضغط حفظ التعديل.';
      nameInput.focus();
    }

    function deleteRecord(index) {
      if (!records[index] || !window.confirm('هل أنت متأكد من حذف هذا السجل؟')) return;
      records.splice(index, 1);
      if (editingIndex === index) {
        editingIndex = null;
        form.reset();
        submitButton.textContent = 'إضافة';
      } else if (editingIndex !== null && editingIndex > index) {
        editingIndex -= 1;
      }
      status.textContent = 'تم حذف السجل.';
      renderTable();
    }

    renderTable();
  </script>
</body>
</html>
